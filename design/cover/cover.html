<!doctype html>
<!-- Khwaab-e-Surkhaab cover art. Source of truth for the cover images.
     Render with: node design/cover/render.cjs  (needs Playwright + Chromium)
     ?layout=wide renders the 1200x630 share image. -->
<html lang="hi">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Rozha'; src: url('fonts/rozha-one-devanagari.woff2') format('woff2'); }
  @font-face { font-family: 'Fraunces'; src: url('fonts/fraunces-var.woff2') format('woff2'); font-weight: 300 900; }
  @font-face { font-family: 'Caveat'; src: url('fonts/caveat-500.woff2') format('woff2'); font-weight: 500; }
  html, body { margin: 0; background: #1e1126; }
  .cover { position: relative; width: 1000px; height: 1000px; overflow: hidden; }
  .cover svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .title { position: absolute; left: 0; right: 0; text-align: center; color: #fbead3; }
  .hi { top: 70px; font-family: 'Rozha', serif; font-size: 128px; line-height: 1.25; letter-spacing: 1px;
        text-shadow: 0 4px 30px rgb(30 10 35 / 0.55); }
  .en { top: 262px; font-family: 'Fraunces', serif; font-weight: 600; font-size: 38px; letter-spacing: 0.32em;
        color: #ffd9a0; padding-left: 0.32em; }
  .tag { position: absolute; left: 0; right: 0; bottom: 34px; text-align: center; font-family: 'Caveat', cursive;
         font-size: 64px; color: #f6b260; }

  /* wide 1200x630 share layout */
  body.wide .cover { width: 1200px; height: 630px; }
  body.wide .hi { top: 120px; left: 60px; right: auto; text-align: left; font-size: 104px; }
  body.wide .en { top: 290px; left: 66px; right: auto; text-align: left; font-size: 30px; padding-left: 0; }
  body.wide .tag { left: 66px; right: auto; text-align: left; bottom: auto; top: 350px; font-size: 54px; }
  body.wide .url { position: absolute; left: 66px; bottom: 34px; font: 600 24px/1 system-ui, sans-serif; color: #fbead3; letter-spacing: 0.04em; }
  body:not(.wide) .url, body:not(.wide) .shade { display: none; }
  body.wide .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgb(28 12 36 / 0.88) 0%, rgb(28 12 36 / 0.7) 38%, rgb(28 12 36 / 0) 62%); }
</style>
</head>
<body>
<div class="cover">
  <svg id="scene" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#22122c" />
        <stop offset="0.28" stop-color="#4e1f4a" />
        <stop offset="0.5" stop-color="#b3346f" />
        <stop offset="0.66" stop-color="#e45a36" />
        <stop offset="0.8" stop-color="#f7b25e" />
      </linearGradient>
      <radialGradient id="sun" cx="0.5" cy="0.45" r="0.55">
        <stop offset="0" stop-color="#fff1c4" />
        <stop offset="0.6" stop-color="#ffd27e" />
        <stop offset="1" stop-color="#ffb35f" />
      </radialGradient>
      <radialGradient id="sunglow" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-color="#ffd38a" stop-opacity="0.55" />
        <stop offset="1" stop-color="#ffd38a" stop-opacity="0" />
      </radialGradient>
      <radialGradient id="lampglow" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-color="#ffe2a0" stop-opacity="0.85" />
        <stop offset="0.4" stop-color="#ffb860" stop-opacity="0.35" />
        <stop offset="1" stop-color="#ffb860" stop-opacity="0" />
      </radialGradient>
      <linearGradient id="ledge" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3a1c3c" />
        <stop offset="0.08" stop-color="#26132e" />
        <stop offset="1" stop-color="#170c1d" />
      </linearGradient>
      <linearGradient id="chai" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#d98a3d" />
        <stop offset="1" stop-color="#8f4a1c" />
      </linearGradient>
      <!-- bougainvillea bloom: three papery bracts -->
      <g id="bloom">
        <path d="M0 0 C-9 -6 -9 -20 0 -24 C9 -20 9 -6 0 0Z" />
        <path d="M0 0 C-9 -6 -9 -20 0 -24 C9 -20 9 -6 0 0Z" transform="rotate(120)" />
        <path d="M0 0 C-9 -6 -9 -20 0 -24 C9 -20 9 -6 0 0Z" transform="rotate(240)" />
        <circle r="2.6" fill="#fff3d6" />
      </g>
      <!-- flying shelduck, wings raised -->
      <g id="bird">
        <path d="M-70 6 C-50 -4 -10 -8 30 -6 C48 -6 60 -12 72 -20 C80 -26 92 -26 98 -20 C102 -16 100 -12 95 -10 L108 -5 L93 -3 C80 -1 66 4 50 8 C20 16 -30 18 -60 14 L-86 22 L-74 10Z" />
        <path d="M-6 0 C-20 -40 -60 -78 -112 -92 C-84 -66 -62 -34 -40 2Z" />
        <path d="M14 -2 C26 -44 64 -86 116 -104 C90 -74 70 -38 48 0Z" />
      </g>
    </defs>

    <rect x="-700" width="2400" height="1000" fill="url(#sky)" />
    <!-- stars -->
    <g fill="#fbead3" opacity="0.7">
      <circle cx="90" cy="60" r="1.6" /><circle cx="210" cy="30" r="1.2" /><circle cx="330" cy="70" r="1" />
      <circle cx="650" cy="40" r="1.4" /><circle cx="770" cy="80" r="1" /><circle cx="900" cy="34" r="1.8" />
      <circle cx="140" cy="350" r="1" /><circle cx="860" cy="330" r="1.2" /><circle cx="560" cy="18" r="1" />
    </g>

    <!-- sun -->
    <circle cx="500" cy="640" r="330" fill="url(#sunglow)" />
    <circle cx="500" cy="640" r="190" fill="url(#sun)" />
    <g fill="#f08a4a" opacity="0.35">
      <rect x="300" y="680" width="400" height="7" rx="3.5" />
      <rect x="320" y="702" width="360" height="6" rx="3" />
      <rect x="350" y="722" width="300" height="5" rx="2.5" />
    </g>

    <!-- pair of surkhaab birds crossing the sun -->
    <g fill="#2a1430">
      <use href="#bird" transform="translate(585 545) scale(0.9) rotate(-6)" />
      <use href="#bird" transform="translate(800 420) scale(0.56) rotate(-10)" />
    </g>

    <!-- hills -->
    <path d="M-700 700 L0 690 C110 650 210 662 300 690 C400 720 470 700 560 676 C680 644 800 668 880 690 C930 702 970 700 1000 694 L1700 694 V1000 H-700Z" fill="#a33461" opacity="0.75" />
    <path d="M-700 740 L0 735 C140 705 260 722 380 742 C520 764 640 726 760 722 C860 718 940 732 1000 740 L1700 740 V1000 H-700Z" fill="#5b2150" />

    <!-- balcony ledge -->
    <rect x="-700" y="790" width="2400" height="210" fill="url(#ledge)" />
    <rect x="-700" y="786" width="2400" height="7" fill="#6a3358" />

    <!-- lantern -->
    <circle cx="140" cy="720" r="150" fill="url(#lampglow)" />
    <g transform="translate(140 640)">
      <path d="M0 0 C-18 0 -26 -14 -14 -24 C-4 -32 4 -32 14 -24 C26 -14 18 0 0 0" fill="none" stroke="#1b0e20" stroke-width="5" />
      <path d="M-34 0 H34 L26 14 H-26Z" fill="#1b0e20" />
      <rect x="-26" y="14" width="52" height="104" rx="8" fill="#ffcd72" />
      <rect x="-26" y="14" width="52" height="104" rx="8" fill="none" stroke="#1b0e20" stroke-width="5" />
      <line x1="0" y1="14" x2="0" y2="118" stroke="#1b0e20" stroke-width="3" opacity="0.5" />
      <path d="M0 46 C-10 62 -9 84 0 92 C9 84 10 62 0 46Z" fill="#fff6dc" />
      <path d="M-38 118 H38 L32 140 H-32Z" fill="#1b0e20" />
    </g>

    <!-- open notebook with pen -->
    <g transform="translate(500 836)">
      <path d="M-150 10 C-100 -4 -40 -2 0 10 C40 -2 100 -4 150 10 L136 62 C96 52 40 54 0 64 C-40 54 -96 52 -136 62Z" fill="#fbead3" />
      <path d="M0 10 V64" stroke="#d8bb98" stroke-width="2.5" />
      <g stroke="#c7a27c" stroke-width="2.4" stroke-linecap="round" fill="none">
        <path d="M-120 24 C-90 18 -60 18 -26 24" /><path d="M-122 38 C-92 32 -62 32 -36 37" /><path d="M-124 51 C-100 46 -78 46 -56 50" />
        <path d="M26 24 C60 18 90 18 120 24" /><path d="M30 37 C60 32 86 32 118 38" />
      </g>
      <rect x="40" y="44" width="110" height="7" rx="3.5" fill="#2a1430" transform="rotate(-14 95 47)" />
      <path d="M146 26 L160 22 L150 32Z" fill="#f6b260" />
    </g>

    <!-- cutting chai -->
    <g transform="translate(850 790)">
      <path d="M-14 -36 C-26 -54 -2 -62 -14 -82" stroke="#fbead3" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.55" />
      <path d="M10 -40 C-2 -58 22 -66 10 -88" stroke="#fbead3" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.45" />
      <path d="M-40 -30 H40 L32 46 H-32Z" fill="#fbead3" opacity="0.35" />
      <path d="M-37 -6 H37 L32 46 H-32Z" fill="url(#chai)" />
      <path d="M-40 -30 H40 L32 46 H-32Z" fill="none" stroke="#fbead3" stroke-width="2.5" opacity="0.7" />
      <ellipse cx="0" cy="-6" rx="37" ry="5" fill="#e7a35c" />
    </g>

    <!-- bougainvillea: branches from the top corners -->
    <g id="flowers">
    <g fill="none" stroke="#3b2a2c" stroke-width="6" stroke-linecap="round">
      <path d="M-10 380 C40 300 60 220 40 120 C30 70 10 40 -10 20" />
      <path d="M40 210 C80 190 110 200 140 230" stroke-width="4" />
      <path d="M1010 420 C960 340 940 260 965 160 C975 110 995 70 1010 50" />
      <path d="M962 250 C920 236 892 250 868 282" stroke-width="4" />
    </g>
    <g fill="#3f6b3a">
      <ellipse cx="62" cy="160" rx="16" ry="8" transform="rotate(-40 62 160)" />
      <ellipse cx="122" cy="214" rx="14" ry="7" transform="rotate(30 122 214)" />
      <ellipse cx="940" cy="200" rx="16" ry="8" transform="rotate(40 940 200)" />
      <ellipse cx="884" cy="266" rx="14" ry="7" transform="rotate(-30 884 266)" />
    </g>
    <g fill="#e0357f">
      <use href="#bloom" transform="translate(20 60) scale(1.3)" /><use href="#bloom" transform="translate(56 100) scale(1.1) rotate(20)" />
      <use href="#bloom" transform="translate(26 140) scale(1.2) rotate(50)" /><use href="#bloom" transform="translate(70 250) scale(1.15)" />
      <use href="#bloom" transform="translate(144 240) scale(1.05) rotate(30)" /><use href="#bloom" transform="translate(30 300) scale(1.25) rotate(70)" />
      <use href="#bloom" transform="translate(990 90) scale(1.3)" /><use href="#bloom" transform="translate(950 130) scale(1.1) rotate(25)" />
      <use href="#bloom" transform="translate(985 190) scale(1.2) rotate(55)" /><use href="#bloom" transform="translate(866 300) scale(1.05)" />
      <use href="#bloom" transform="translate(930 290) scale(1.15) rotate(15)" /><use href="#bloom" transform="translate(975 350) scale(1.25) rotate(80)" />
    </g>
    <g fill="#ff6fae">
      <use href="#bloom" transform="translate(98 210) scale(0.9) rotate(10)" /><use href="#bloom" transform="translate(4 220) scale(1) rotate(40)" />
      <use href="#bloom" transform="translate(906 240) scale(0.9) rotate(60)" /><use href="#bloom" transform="translate(1000 260) scale(1) rotate(30)" />
    </g>
    </g>
  </svg>

  <div class="shade"></div>
  <div class="title hi">ख़्वाब-ए-सुर्ख़ाब</div>
  <div class="title en">KHWAAB-E-SURKHAAB</div>
  <div class="tag">Kuch khwaab abhi baaki hain…</div>
  <div class="url">tatsatpandey.com/khwaab</div>
</div>
<script>
  if (new URLSearchParams(location.search).get('layout') === 'wide') {
    document.body.classList.add('wide');
    const sc = document.getElementById('scene');
    sc.setAttribute('viewBox', '-640 181 1560 819');
    document.getElementById('flowers').style.display = 'none';
  }
</script>
</body>
</html>
